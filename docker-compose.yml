version: '3.8'

services:
  # ============================================================================
  # 1. PRIMARY APPLICATION DATABASE: MONGODB 7.0
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: enterprise-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: enterprise_ai
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise-network

  # ============================================================================
  # 2. CACHE & SESSION STORE: REDIS 7.2
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: enterprise-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise-network

  # ============================================================================
  # 3. VECTOR DATABASE FOR RAG: QDRANT
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: enterprise-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - enterprise-network

  # ============================================================================
  # 4. ENTERPRISE CORE BACKEND (JAVA SPRING BOOT 3)
  # ============================================================================
  core-backend:
    build:
      context: ./core-backend
      dockerfile: Dockerfile
    container_name: enterprise-core-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/enterprise_ai
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - AI_SERVICE_URL=http://ai-service:8000
      - INTERNAL_SERVICE_API_KEY=enterprise-internal-m2m-token-84920482049284092
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - enterprise-network

  # ============================================================================
  # 5. AI & MULTI-AGENT SERVICE (PYTHON FASTAPI & LANGGRAPH)
  # ============================================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: enterprise-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/enterprise_ai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - INTERNAL_SERVICE_API_KEY=enterprise-internal-m2m-token-84920482049284092
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - enterprise-network

  # ============================================================================
  # 6. FRONTEND WEB CLIENT (REACT + VITE + TYPESCRIPT)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterprise-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - core-backend
      - ai-service
    networks:
      - enterprise-network

networks:
  enterprise-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  qdrant_data:
